query ListPendingUsers @auth(level: PUBLIC) {
  users(where: {verificationStatus: {eq: "pending"}}) {
    id
    email
    fullName
    studentId
    facultyReference
    certificateUrl
    verificationStatus
  }
}

query GetUser($id: String!) @auth(level: PUBLIC) {
  user(id: $id) {
    id
    email
    fullName
    studentId
    facultyReference
    certificateUrl
    verificationStatus
    preferredRole
    gender
  }
}

query ListHelpRequests @auth(level: PUBLIC) {
  helpRequests(where: {_or: [{status: {eq: "OPEN"}}, {status: {eq: null}}]}) {
    id
    title
    description
    budget
    category
    urgency
    deadline
    status
    requester {
      id
      fullName
      email
      certificateUrl
      verificationStatus
    }
  }
}

query ListApplicationsByApplicant($userId: String!) @auth(level: PUBLIC) {
  applications(where: {applicantId: {eq: $userId}}) {
    id
    priceOffer
    message
    status
    createdAt
    helpRequest {
      id
      title
      budget
      urgency
      deadline
      category
      requester {
        id
        fullName
      }
    }
  }
}

query ListApplicationsForMyRequests($userId: String!) @auth(level: PUBLIC) {
  applications(where: {helpRequest: {requesterId: {eq: $userId}}}) {
    id
    priceOffer
    message
    status
    createdAt
    applicant {
      id
      fullName
      email
    }
    helpRequest {
      id
      title
      urgency
      deadline
      requesterId
    }
  }
}

query ListMyHelpRequestsWithApplications($userId: String!) @auth(level: PUBLIC) {
  helpRequests(where: {requesterId: {eq: $userId}}) {
    id
    title
    budget
    status
    urgency
    deadline
    category
    description
    applications_on_helpRequest {
      id
      priceOffer
      message
      status
      applicant {
        id
        fullName
        studentId
      }
    }
  }
}

query ListConversations($userId: String!) @auth(level: PUBLIC) {
  conversations(where: {_or: [{posterId: {eq: $userId}}, {applicantId: {eq: $userId}}]}) {
    id
    createdAt
    poster {
      id
      fullName
    }
    applicant {
      id
      fullName
    }
    application {
      id
      status
      priceOffer
      message
      helpRequest {
        id
        title
        budget
        urgency
        status
      }
    }
  }
}

query ListAllUsers @auth(level: PUBLIC) {
  users {
    id
    email
    fullName
    studentId
    facultyReference
    certificateUrl
    verificationStatus
    preferredRole
    gender
  }
}

query ListAllHelpRequestsAdmin @auth(level: PUBLIC) {
  helpRequests {
    id
    title
    budget
    status
    requester {
      id
      fullName
    }
  }
}

query ListAllApplicationsAdmin @auth(level: PUBLIC) {
  applications {
    id
    status
    priceOffer
    applicant {
      id
      fullName
    }
    helpRequest {
      id
      title
    }
  }
}

query GetUserProfile($id: String!) @auth(level: PUBLIC) {
  user(id: $id) {
    id
    email
    fullName
    studentId
    certificateUrl
    verificationStatus
    applications_on_applicant {
      id
      status
    }
    helpRequests_on_requester {
      id
      status
    }
  }
}
